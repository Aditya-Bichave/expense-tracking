# CodeScene PR Refactoring Agent
#
# On-demand only: comment `/cs-agent` on a pull request and the agent proposes
# refactorings for the code-health issues CodeScene found in that PR, pushing
# them as commits to the PR branch.
#
# Docs: https://codescene.io/docs/developer-tools/pr-refactoring-agent.html
# Action: https://github.com/codescene-oss/pr-refactoring-agent
name: CodeScene Refactoring Agent

on:
  issue_comment:
    types: [created]

# One agent run per PR. Two concurrent runs would push commits to the same
# branch and race each other.
concurrency:
  group: cs-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write # pushes refactoring commits to the PR branch
  pull-requests: write # posts results back onto the PR
  issues: write # updates the triggering comment

jobs:
  refactor:
    name: 🤖 Refactor on /cs-agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Three conditions, all required:
    #  1. the comment is on a pull request, not a plain issue;
    #  2. it actually asks for the agent;
    #  3. the author has write access.
    #
    # (3) is the security gate. `issue_comment` runs against the base repo with
    # full access to the secrets below, and anyone can comment on a public PR.
    # Without this check any drive-by commenter could spend our LLM budget and
    # push commits to a branch we are about to merge.
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/cs-agent') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - uses: codescene-oss/pr-refactoring-agent@v1.0.8
        with:
          pr_number: ${{ github.event.issue.number }}
          command: ${{ github.event.comment.body }}
          # CodeScene advises using the strongest coding-focused model available
          # to you; the agent's output quality tracks the model directly. Bump
          # this when a stronger model is approved for the org.
          model: "anthropic/claude-sonnet-4-6-20251101"
          codescene_token: ${{ secrets.CODESCENE_ACCESS_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
